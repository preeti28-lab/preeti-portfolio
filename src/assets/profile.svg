<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Developer illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3366ff"/>
      <stop offset="55%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5cfae"/>
      <stop offset="100%" stop-color="#e7b489"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#fff" stroke-width="1.2">
    <path d="M0 64h512M0 128h512M0 192h512M0 256h512M0 320h512M0 384h512M0 448h512"/>
    <path d="M64 0v512M128 0v512M192 0v512M256 0v512M320 0v512M384 0v512M448 0v512"/>
  </g>
  <circle cx="120" cy="110" r="80" fill="#fff" opacity="0.10"/>
  <circle cx="420" cy="150" r="46" fill="#fff" opacity="0.12"/>

  <!-- Floating code tags -->
  <g font-family="ui-monospace, monospace" font-size="26" fill="#ffffff" opacity="0.55" font-weight="700">
    <text x="52" y="212">&lt;/&gt;</text>
    <text x="404" y="256">{ }</text>
    <text x="72" y="416">( )</text>
  </g>

  <!-- Character -->
  <g>
    <!-- Shoulders / torso -->
    <path d="M256 300c-70 0-124 40-134 100-3 18 8 30 26 30h216c18 0 29-12 26-30-10-60-64-100-134-100z" fill="url(#shirt)"/>
    <!-- Collar -->
    <path d="M222 306l34 42 34-42-16-10h-36z" fill="#0f172a" opacity="0.75"/>
    <!-- Neck -->
    <path d="M232 262h48v52c0 12-48 12-48 0z" fill="#e0a97c"/>
    <!-- Head -->
    <ellipse cx="256" cy="212" rx="72" ry="82" fill="url(#skin)"/>
    <!-- Hair -->
    <path d="M184 208c-6-58 30-96 72-96s78 38 72 96c-4-30-16-44-32-50-22 12-62 14-86-2-14 8-22 24-26 52z" fill="#2b2118"/>
    <!-- Ears -->
    <ellipse cx="184" cy="216" rx="11" ry="16" fill="#e7b489"/>
    <ellipse cx="328" cy="216" rx="11" ry="16" fill="#e7b489"/>
    <!-- Glasses -->
    <g fill="none" stroke="#0f172a" stroke-width="6" opacity="0.9">
      <rect x="199" y="192" width="52" height="40" rx="12"/>
      <rect x="263" y="192" width="52" height="40" rx="12"/>
      <path d="M251 210h12M199 206l-16-6M315 206l16-6"/>
    </g>
    <!-- Eyes -->
    <circle cx="225" cy="212" r="6" fill="#1f2937"/>
    <circle cx="289" cy="212" r="6" fill="#1f2937"/>
    <!-- Smile -->
    <path d="M232 250c8 12 40 12 48 0" fill="none" stroke="#a9663d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Laptop -->
  <g>
    <rect x="168" y="384" width="176" height="112" rx="10" fill="url(#screen)"/>
    <rect x="182" y="398" width="148" height="84" rx="6" fill="#0b1224"/>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#7dd3fc">
      <text x="192" y="418">const dev = {</text>
      <text x="200" y="436" fill="#c4b5fd">stack: 'React',</text>
      <text x="200" y="454" fill="#86efac">ships: true</text>
      <text x="192" y="472">}</text>
    </g>
  </g>
</svg>
